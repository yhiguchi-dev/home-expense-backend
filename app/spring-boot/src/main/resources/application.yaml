spring:
  application:
    name: spring-boot
  profiles:
    active: "aws"
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: ${SPRING_TASK_EXECUTION_SHUTDOWN_AWAIT_TERMINATION_PERIOD:30s}
logging:
  structured:
    format:
      console: ecs
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
