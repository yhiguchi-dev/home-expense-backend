quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = ${DB_USERNAME}
quarkus.datasource.password = ${DB_PASSWORD}
quarkus.datasource.jdbc.url = ${DB_URL}
quarkus.datasource.jdbc.min-size = 5
quarkus.datasource.jdbc.max-size = 20
quarkus.datasource.jdbc.acquisition-timeout = 5S
quarkus.datasource.readonly.db-kind = postgresql
quarkus.datasource.readonly.username = ${DB_READONLY_USERNAME}
quarkus.datasource.readonly.password = ${DB_READONLY_PASSWORD}
quarkus.datasource.readonly.jdbc.url = ${DB_READONLY_URL}
quarkus.datasource.readonly.jdbc.min-size = 5
quarkus.datasource.readonly.jdbc.max-size = 20
quarkus.datasource.readonly.jdbc.acquisition-timeout = 5S
quarkus.http.port = 8080
quarkus.http.enable-compression = true
quarkus.http.header.X-Content-Type-Options.value = nosniff
quarkus.http.header.X-Frame-Options.value = DENY
quarkus.http.header.Strict-Transport-Security.value = max-age=31536000; includeSubDomains
quarkus.http.cors.enabled = true
quarkus.http.cors.origins = ${CORS_ORIGINS}
quarkus.http.cors.methods = GET,POST,PUT,DELETE
quarkus.http.cors.headers = Content-Type,Accept
quarkus.http.header.Content-Security-Policy.value = default-src 'none'; frame-ancestors 'none'
quarkus.log.level = INFO
%dev.quarkus.datasource.username = expense
%dev.quarkus.datasource.password = password
%dev.quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5432/expense
%dev.quarkus.datasource.readonly.username = expense
%dev.quarkus.datasource.readonly.password = password
%dev.quarkus.datasource.readonly.jdbc.url = jdbc:postgresql://localhost:5432/expense
%dev.quarkus.http.cors.origins = http://localhost:3000
%dev.quarkus.log.level = DEBUG
%dev.quarkus.log.console.json.enabled = false
%test.quarkus.datasource.username = expense
%test.quarkus.datasource.password = password
%test.quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5432/expense_test
%test.quarkus.datasource.readonly.username = expense
%test.quarkus.datasource.readonly.password = password
%test.quarkus.datasource.readonly.jdbc.url = jdbc:postgresql://localhost:5432/expense_test
%test.quarkus.log.level = DEBUG
%test.quarkus.log.console.json.enabled = false
