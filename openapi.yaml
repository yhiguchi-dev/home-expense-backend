openapi: 3.1.0
info:
  title: Home Expense API
  description: |
    API for managing home expenses and income.

    ## Conventions

    - **Optimistic locking**: Single-resource `GET` responses include an `ETag` header.
      `PUT` requests require the `If-Match` header echoing the last observed `ETag` value.
      Missing `If-Match` → `428 Precondition Required`. Mismatched `If-Match` → `412 Precondition Failed`.
    - **Caching**: All `/v1/*` responses carry `Cache-Control: no-store` to prevent intermediate
      caches from retaining private financial data.
    - **Edge concerns**: TLS termination, CORS, HSTS and other security response headers are
      applied by the Envoy Gateway in front of this service and are not documented in this spec.
      See `docs/http-headers.md` for the policy.
  contact:
    name: API Support
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.2.0
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /v1/expense-attributes:
    get:
      tags:
        - Expense Attributes
      summary: Get list of expense attributes
      operationId: getExpenseAttributes
      parameters:
        - description: Filter by category
          in: query
          name: category
          schema:
            enum:
              - 固定費
              - 変動費
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseAttributeListResponse'
          description: Successful response
          headers:
            Link:
              description: Pagination links (RFC 5988)
              schema:
                type: string
        "400":
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - Expense Attributes
      summary: Create a new expense attribute
      operationId: createExpenseAttribute
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseAttributePostRequest'
        required: true
      responses:
        "201":
          description: Expense attribute created successfully
          headers:
            Location:
              description: URI of the created resource
              schema:
                type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/Conflict'
  /v1/expense-attributes/{id}:
    get:
      tags:
        - Expense Attributes
      summary: Get expense attribute by ID
      operationId: getExpenseAttributeById
      parameters:
        - $ref: '#/components/parameters/ExpenseAttributeId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseAttributeGetResponse'
          description: Successful response
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Expense Attributes
      summary: Update an expense attribute
      operationId: updateExpenseAttribute
      parameters:
        - $ref: '#/components/parameters/ExpenseAttributeId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseAttributePutRequest'
        required: true
      responses:
        "204":
          description: Expense attribute updated successfully
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "412":
          $ref: '#/components/responses/PreconditionFailed'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags:
        - Expense Attributes
      summary: Delete an expense attribute
      operationId: deleteExpenseAttribute
      parameters:
        - $ref: '#/components/parameters/ExpenseAttributeId'
      responses:
        "204":
          description: Expense attribute deleted successfully
        "409":
          $ref: '#/components/responses/Conflict'
  /v1/expenses:
    get:
      tags:
        - Expenses
      summary: Get list of expenses
      description: Retrieve a paginated list of expenses with optional filters
      operationId: getExpenses
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - description: Filter by year
          in: query
          name: year
          schema:
            minimum: 1
            type: integer
        - description: Filter by month
          in: query
          name: month
          schema:
            maximum: 12
            minimum: 1
            type: integer
        - description: Filter by expense category
          in: query
          name: category
          schema:
            enum:
              - 固定費
              - 変動費
            type: string
        - description: Filter by expense attribute ID
          in: query
          name: attribute_id
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseListResponse'
          description: Successful response
          headers:
            Link:
              description: Pagination links (RFC 5988)
              schema:
                type: string
        "400":
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - Expenses
      summary: Create a new expense
      operationId: createExpense
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpensePostRequest'
        required: true
      responses:
        "201":
          description: Expense created successfully
          headers:
            Location:
              description: URI of the created resource
              schema:
                type: string
        "400":
          $ref: '#/components/responses/BadRequest'
  /v1/expenses/statistics:
    get:
      tags:
        - Expense Statistics
      summary: Get expense statistics
      description: Retrieve expense statistics for a specific month
      operationId: getExpenseStatistics
      parameters:
        - description: Year for statistics
          in: query
          name: year
          required: true
          schema:
            minimum: 1
            type: integer
        - description: Month for statistics
          in: query
          name: month
          required: true
          schema:
            maximum: 12
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseStatisticsResponse'
          description: Successful response
        "400":
          $ref: '#/components/responses/BadRequest'
  /v1/expenses/{id}:
    get:
      tags:
        - Expenses
      summary: Get expense by ID
      operationId: getExpenseById
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseGetResponse'
          description: Successful response
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Expenses
      summary: Update an expense
      operationId: updateExpense
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpensePutRequest'
        required: true
      responses:
        "204":
          description: Expense updated successfully
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "412":
          $ref: '#/components/responses/PreconditionFailed'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags:
        - Expenses
      summary: Delete an expense
      operationId: deleteExpense
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
      responses:
        "204":
          description: Expense deleted successfully
        "404":
          $ref: '#/components/responses/NotFound'
  /v1/income-attributes:
    get:
      tags:
        - Income Attributes
      summary: Get list of income attributes
      operationId: getIncomeAttributes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeAttributeListResponse'
          description: Successful response
          headers:
            Link:
              description: Pagination links (RFC 5988)
              schema:
                type: string
        "400":
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - Income Attributes
      summary: Create a new income attribute
      operationId: createIncomeAttribute
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeAttributePostRequest'
        required: true
      responses:
        "201":
          description: Income attribute created successfully
          headers:
            Location:
              description: URI of the created resource
              schema:
                type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/Conflict'
  /v1/income-attributes/{id}:
    get:
      tags:
        - Income Attributes
      summary: Get income attribute by ID
      operationId: getIncomeAttributeById
      parameters:
        - $ref: '#/components/parameters/IncomeAttributeId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeAttributeGetResponse'
          description: Successful response
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Income Attributes
      summary: Update an income attribute
      operationId: updateIncomeAttribute
      parameters:
        - $ref: '#/components/parameters/IncomeAttributeId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeAttributePutRequest'
        required: true
      responses:
        "204":
          description: Income attribute updated successfully
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "412":
          $ref: '#/components/responses/PreconditionFailed'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags:
        - Income Attributes
      summary: Delete an income attribute
      operationId: deleteIncomeAttribute
      parameters:
        - $ref: '#/components/parameters/IncomeAttributeId'
      responses:
        "204":
          description: Income attribute deleted successfully
        "409":
          $ref: '#/components/responses/Conflict'
  /v1/incomes:
    get:
      tags:
        - Incomes
      summary: Get list of incomes
      operationId: getIncomes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - description: Filter by year
          in: query
          name: year
          schema:
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeListResponse'
          description: Successful response
          headers:
            Link:
              description: Pagination links (RFC 5988)
              schema:
                type: string
        "400":
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - Incomes
      summary: Create a new income
      operationId: createIncome
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomePostRequest'
        required: true
      responses:
        "201":
          description: Income created successfully
          headers:
            Location:
              description: URI of the created resource
              schema:
                type: string
        "400":
          $ref: '#/components/responses/BadRequest'
  /v1/incomes/{id}:
    get:
      tags:
        - Incomes
      summary: Get income by ID
      operationId: getIncomeById
      parameters:
        - $ref: '#/components/parameters/IncomeId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeGetResponse'
          description: Successful response
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Incomes
      summary: Update an income
      operationId: updateIncome
      parameters:
        - $ref: '#/components/parameters/IncomeId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomePutRequest'
        required: true
      responses:
        "204":
          description: Income updated successfully
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "412":
          $ref: '#/components/responses/PreconditionFailed'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags:
        - Incomes
      summary: Delete an income
      operationId: deleteIncome
      parameters:
        - $ref: '#/components/parameters/IncomeId'
      responses:
        "204":
          description: Income deleted successfully
components:
  schemas:
    ExpenseAttributeGetResponse:
      properties:
        category:
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
      type: object
    ExpenseAttributeListResponse:
      properties:
        expense_attributes:
          items:
            $ref: '#/components/schemas/ExpenseAttributeGetResponse'
          type: array
      type: object
    ExpenseAttributePostRequest:
      properties:
        category:
          enum:
            - 固定費
            - 変動費
          type: string
        name:
          maxLength: 512
          type: string
      required:
        - name
        - category
      type: object
    ExpenseAttributePutRequest:
      properties:
        category:
          enum:
            - 固定費
            - 変動費
          type: string
        name:
          maxLength: 512
          type: string
      required:
        - name
        - category
      type: object
    ExpenseAttributeResponse:
      properties:
        category:
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
      type: object
    ExpenseAttributeStatisticsResponse:
      properties:
        attribute_id:
          format: uuid
          type: string
        attribute_name:
          type: string
        total_amount:
          type: integer
      type: object
    ExpenseGetResponse:
      properties:
        description:
          type: string
        expense_attribute:
          $ref: '#/components/schemas/ExpenseAttributeResponse'
        id:
          format: uuid
          type: string
        payment_date:
          format: date
          type: string
        price:
          type: integer
      type: object
    ExpenseListResponse:
      properties:
        expenses:
          items:
            $ref: '#/components/schemas/ExpenseGetResponse'
          type: array
      type: object
    ExpensePostRequest:
      properties:
        attribute_id:
          format: uuid
          type: string
        description:
          maxLength: 512
          type: string
        payment_date:
          example: "2026-04-10"
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
        price:
          minimum: 1
          type: integer
      required:
        - description
        - price
        - payment_date
        - attribute_id
      type: object
    ExpensePutRequest:
      properties:
        attribute_id:
          format: uuid
          type: string
        description:
          maxLength: 512
          type: string
        payment_date:
          example: "2026-04-10"
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
        price:
          minimum: 1
          type: integer
      required:
        - description
        - price
        - payment_date
        - attribute_id
      type: object
    ExpenseStatisticsDetailResponse:
      properties:
        attribute_statistics:
          items:
            $ref: '#/components/schemas/ExpenseAttributeStatisticsResponse'
          type: array
        total_amount:
          description: Total amount for the category
          type: integer
      type: object
    ExpenseStatisticsResponse:
      properties:
        disposal_income_amount:
          description: Disposable income (income - total expenses)
          type: integer
        fixed_expense_detail:
          $ref: '#/components/schemas/ExpenseStatisticsDetailResponse'
        income_total_amount:
          description: Total income amount for the month
          type: integer
        total_amount:
          description: Total expense amount
          type: integer
        variable_expense_detail:
          $ref: '#/components/schemas/ExpenseStatisticsDetailResponse'
      type: object
    IncomeAttributeGetResponse:
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
      type: object
    IncomeAttributeListResponse:
      properties:
        income_attributes:
          items:
            $ref: '#/components/schemas/IncomeAttributeGetResponse'
          type: array
      type: object
    IncomeAttributePostRequest:
      properties:
        name:
          maxLength: 512
          type: string
      required:
        - name
      type: object
    IncomeAttributePutRequest:
      properties:
        name:
          maxLength: 512
          type: string
      required:
        - name
      type: object
    IncomeAttributeResponse:
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
      type: object
    IncomeGetResponse:
      properties:
        amount:
          type: integer
        description:
          type: string
        id:
          format: uuid
          type: string
        income_attribute:
          $ref: '#/components/schemas/IncomeAttributeResponse'
        receive_date:
          format: date
          type: string
      type: object
    IncomeListResponse:
      properties:
        incomes:
          items:
            $ref: '#/components/schemas/IncomeGetResponse'
          type: array
      type: object
    IncomePostRequest:
      properties:
        amount:
          minimum: 1
          type: integer
        attribute_id:
          format: uuid
          type: string
        description:
          maxLength: 512
          type: string
        receive_date:
          example: "2026-04-25"
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
      required:
        - description
        - amount
        - receive_date
        - attribute_id
      type: object
    IncomePutRequest:
      properties:
        amount:
          minimum: 1
          type: integer
        attribute_id:
          format: uuid
          type: string
        description:
          maxLength: 512
          type: string
        receive_date:
          example: "2026-04-25"
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
      required:
        - description
        - amount
        - receive_date
        - attribute_id
      type: object
    ProblemDetail:
      description: RFC 9457 Problem Details for HTTP APIs
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem
          example: descriptionは必須入力です
          type: string
        instance:
          description: A URI reference that identifies the specific occurrence of the problem
          example: /v1/expenses
          format: uri
          type: string
        status:
          description: The HTTP status code
          example: 400
          type: integer
        title:
          description: A short, human-readable summary of the problem type
          example: Bad Request
          type: string
        type:
          description: A URI reference that identifies the problem type
          example: about:blank
          format: uri
          type: string
      type: object
  responses:
    BadRequest:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: descriptionは必須入力です
            instance: /v1/expenses
            status: 400
            title: Bad Request
            type: about:blank
    Conflict:
      description: Resource conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: 既に登録されています
            instance: /v1/expense-attributes
            status: 409
            title: Conflict
            type: about:blank
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: 経費が見つかりません
            instance: /v1/expenses/123
            status: 404
            title: Not Found
            type: about:blank
    PreconditionFailed:
      description: |
        The `If-Match` value did not match the current resource version.
        The client should re-fetch the resource to obtain a fresh `ETag` and retry.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: リソースが他のリクエストによって更新されています
            instance: /v1/expenses/123
            status: 412
            title: Precondition Failed
            type: about:blank
    PreconditionRequired:
      description: |
        The `If-Match` header was missing or malformed. RFC 6585 §3.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            detail: If-Matchヘッダーは必須です
            instance: /v1/expenses/123
            status: 428
            title: Precondition Required
            type: about:blank
  parameters:
    ExpenseAttributeId:
      name: id
      in: path
      description: Expense attribute ID
      required: true
      schema:
        format: uuid
        type: string
    ExpenseId:
      name: id
      in: path
      description: Expense ID
      required: true
      schema:
        format: uuid
        type: string
    IfMatch:
      name: If-Match
      in: header
      description: |
        Opaque resource version echoed from a prior `ETag` response header.
        Used for optimistic locking on `PUT` operations (RFC 9110 §13.1.1).
      required: true
      schema:
        type: string
    IncomeAttributeId:
      name: id
      in: path
      description: Income attribute ID
      required: true
      schema:
        format: uuid
        type: string
    IncomeId:
      name: id
      in: path
      description: Income ID
      required: true
      schema:
        format: uuid
        type: string
    Page:
      name: page
      in: query
      description: Page number
      schema:
        default: 1
        minimum: 1
        type: integer
    PerPage:
      name: per_page
      in: query
      description: Number of items per page
      schema:
        default: 20
        maximum: 100
        minimum: 1
        type: integer
  headers:
    ETag:
      description: |
        Opaque resource version identifier used for optimistic locking (RFC 9110 §8.8.3).
        Echo this value in `If-Match` on subsequent `PUT` requests.
      schema:
        type: string
  requestBodies: []
  securitySchemes: []
tags:
  - name: Expenses
    description: Operations related to expenses
  - name: Expense Attributes
    description: Operations related to expense categories and attributes
  - name: Expense Statistics
    description: Operations for expense statistics
  - name: Incomes
    description: Operations related to incomes
  - name: Income Attributes
    description: Operations related to income attributes
