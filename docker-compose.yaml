services:
  database:
    image: postgres:16.3
    environment:
      - POSTGRES_USER=expense
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=expense
    healthcheck:
      test: pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - 5432:5432
    volumes:
      - database_volume:/var/lib/postgresql/data
  flyway:
    build: db-migration
    depends_on:
      database:
        condition: service_healthy
volumes:
  database_volume: